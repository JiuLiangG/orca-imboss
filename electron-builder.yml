appId: com.orcastudio.imboss
productName: imboss
directories:
  output: dist
  buildResources: build
files:
  - "out/**"
  - "!**/.DS_Store"
  - "!**/node_modules/.cache/**"
  - "!**/*.{ttf,woff}"
asar: true
asarUnpack:
  - "**/*.{wasm,node,dll,dylib,so,so.*}"
  - "**/*.wasm"
  - resources/**
win:
  executableName: orca-imboss
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  deleteAppDataOnUninstall: false
  artifactName: orca-imboss-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
mac:
  icon: resources/icon.png
  publish:
    provider: github
    owner: sethyuan
    repo: orca-imboss
    releaseType: release
    channel: latest-${arch}
dmg:
  artifactName: orca-imboss-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: kefroth@outlook.com
  category: Utility
appImage:
  artifactName: orca-imboss-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: sethyuan
  repo: orca-imboss
  releaseType: release
